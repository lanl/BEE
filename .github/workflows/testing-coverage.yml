name: Testing and Coverage

permissions:
  contents: read

on:
  # For manual exec
  # (https://github.blog/changelog/2020-07-06-github-actions-manual-triggers-with-workflow_dispatch/)
  workflow_dispatch: {}
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, edited, labeled, unlabeled]
    branches: [main, develop]

env: {}

jobs:
  integration-test:
    if: ${{ !(contains(github.event.pull_request.labels.*.name, 'WIP (no-ci)')) && !(contains(github.event.pull_request.labels.*.name, 'WIP (lint-only)')) }}
    name: BEE Integration Test
    strategy:
      fail-fast: false
      matrix:
        bee_worker: [Slurmrestd, SlurmCommands, Flux]
        # TODO get neo4j test to work again
        # gdb_backend: [neo4j, sqlite3]
        gdb_backend: [sqlite3]
    env:
      BEE_WORKER: ${{ matrix.bee_worker }}
      GDB_BACKEND: ${{ matrix.gdb_backend }}
    # Note: Needs to run on 22.04 or later since slurmrestd doesn't seem to be
    # available on 20.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install and Configure
        run: |
          . ./ci/env.sh
          echo "LOG_DIR=$LOG_DIR" >> $GITHUB_ENV
          echo "SLURM_CONF=$SLURM_CONF" >> $GITHUB_ENV
          echo "BEE_WORKDIR=$BEE_WORKDIR" >> $GITHUB_ENV
          echo "BEE_CONFIG=$BEE_CONFIG" >> $GITHUB_ENV 
          ./ci/deps_install.sh
          ./ci/batch_scheduler.sh
          ./ci/bee_install.sh
          ./ci/bee_config.sh
      - name: Integration Test
        run: |
          . ./ci/env.sh
          ./ci/integration_test.sh
          mv .coverage.integration ".coverage.${{ matrix.bee_worker }}.${{ matrix.gdb_backend }}"
      - name: Stash bee error logs
        if: failure()   # only when the job fails
        run: |
          mkdir bee-error-logs
          cp bee-error-*.log bee-error-logs || true
          cp -R $LOG_DIR bee-error-logs || true
          cp -R $SLURM_CONF bee-error-logs || true
          cp -R $BEE_WORKDIR/logs bee-error-logs || true
          cp -R $BEE_WORKDIR/*.db bee-error-logs || true
          cp -R $BEE_CONFIG bee-error-logs || true
      - name: Upload bee error logs
        if: failure()    # only when the job fails
        uses: actions/upload-artifact@v4
        with:
          name: bee-error-logs-${{ matrix.bee_worker }}-${{ matrix.gdb_backend }}
          path: bee-error-logs
          if-no-files-found: ignore
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.bee_worker }}-${{ matrix.gdb_backend }}
          include-hidden-files: true
          path: ".coverage.${{ matrix.bee_worker }}.${{ matrix.gdb_backend }}"

  unit-test:
    if: ${{ !(contains(github.event.pull_request.labels.*.name, 'WIP (no-ci)')) && !(contains(github.event.pull_request.labels.*.name, 'WIP (lint-only)')) }}
    name: BEE Unit Tests
    env:
      # Unit tests are only run with slurmrestd right now
      BEE_WORKER: Slurmrestd
    # Note: Needs to run on 22.04 or later since slurmrestd doesn't seem to be
    # available on 20.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install and Configure
        run: |
          . ./ci/env.sh
          ./ci/deps_install.sh
          ./ci/batch_scheduler.sh
          ./ci/bee_install.sh
          ./ci/bee_config.sh
      - name: Unit tests
        run: |
          . ./ci/env.sh
          ./ci/unit_tests.sh
          mv .coverage ".coverage.unittests"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-tests
          include-hidden-files: true
          path: ".coverage.unittests"

  coverage:
    needs: [integration-test, unit-test]
    name: Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit-tests
          path: ./

      # - name: Get Slurmrestd+neo4j coverage
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: coverage-Slurmrestd-neo4j
      #     path: ./
      
      - name: Get Slurmrestd+sqlite3 coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-Slurmrestd-sqlite3
          path: ./
      
      # - name: Get SlurmCommands+neo4j coverage
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: coverage-SlurmCommands-neo4j
      #     path: ./
      
      - name: Get SlurmCommands+sqlite3 coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-SlurmCommands-sqlite3
          path: ./
      
      # - name: Get Flux+neo4j coverage
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: coverage-Flux-neo4j
      #     path: ./
      
      - name: Get Flux+sqlite3 coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-Flux-sqlite3
          path: ./

      - name: Combine coverage
        run: |
          pip install coverage
          coverage combine
          coverage report --show-missing
       
      - name: Add coverage to job summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report --show-missing >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Coverage Badge
        run: |
          coverage xml
          pip install -U genbadge defusedxml
          genbadge coverage -i coverage.xml -o coverage.svg

      - name: Upload coverage badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: ./coverage.svg

      - name: Coverage comment
        id: coverage
        continue-on-error: true
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-xml-coverage-path: coverage.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: "Coverage Report"
          hide-emoji: true
          hide-report: true
          create-new-comment: true

      - name: Extract coverage number
        id: coverage-num
        run: |
          COV="${{ steps.coverage.outputs.coverage }}"
          echo "value=${COV%\%}" >> $GITHUB_OUTPUT

      - name: Low coverage job summary
        if: ${{ steps.coverage-num.outputs.value < 65 }}
        run: |
          echo "::error::Coverage is below 65%: ${{ steps.coverage-num.outputs.value }}%"
          echo "## Coverage is below 65%: ${{ steps.coverage-num.outputs.value }}%" >> $GITHUB_STEP_SUMMARY
          coverage report --fail-under=65

      - name: Verify Changed Files
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: tj-actions/verify-changed-files@v20
        id: verify-changed-files
        with:
          files: |
            coverage.svg

      - name: Commit and push coverage badge
        if: steps.verify-changed-files.outputs.files_changed == 'true' && github.actor != 'github-actions[bot]' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage.svg
          git commit -m "Updated coverage.svg"
          git push
